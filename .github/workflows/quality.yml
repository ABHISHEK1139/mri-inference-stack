name: Quality Checks

on:
  push:
    branches: ["main", "master"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The model weights are LFS-tracked. `lfs: true` fetches them so the
          # preflight artifact checks and the app import path run against real
          # files rather than pointer stubs.
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The lock file pins the exact stack the tests were validated against.
          pip install -r requirements.lock
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Compile check
        run: |
          python -m compileall -q \
            app.py train.py config.py preprocessing.py \
            data models training evaluation scripts tests

      - name: Preflight structural check
        run: python scripts/preflight.py --ci-mode

      - name: Model construction smoke test
        run: |
          python -c "
          from models.detection import build_detection_model
          m = build_detection_model()
          assert m.output_shape == (None, 1), m.output_shape
          print('detection: OK')
          "
          python -c "
          from models.classifier import build_classifier
          m = build_classifier()
          assert m.output_shape == (None, 4), m.output_shape
          print('classifier: OK')
          "
          python -c "
          from models.segmentation import build_unet
          m = build_unet(input_shape=(128, 128, 1))
          assert m.output_shape == (None, 128, 128, 1), m.output_shape
          print('segmentation: OK')
          "
          python -c "
          from models.gan import build_v2_generator, build_v2_discriminator
          g = build_v2_generator(latent_dim=100, num_classes=4, output_shape=(64, 64, 1))
          d = build_v2_discriminator(input_shape=(64, 64, 1), num_classes=4)
          print('gan-v2: OK')
          "

      - name: Training data pipeline smoke test
        run: |
          # Guards the tf.data graph-tracing regression where augment_image used
          # a Python `if` on a symbolic tensor, which crashed every
          # augment=True training run at the first batch.
          python -c "
          import numpy as np
          from data.dataset import build_classifier_dataset
          ds = build_classifier_dataset(
              np.zeros((8, 64, 64, 1), np.float32), list(range(8)), batch_size=4
          )
          x, y = next(iter(ds))
          assert tuple(x.shape) == (4, 64, 64, 1), x.shape
          assert tuple(y.shape) == (4, 4), y.shape
          print('tf.data pipeline: OK')
          "

      - name: Unit and regression tests
        run: python -m pytest tests/ -v --tb=short -m "not slow"

      - name: Trainer integration tests
        run: python -m pytest tests/test_trainers_integration.py tests/test_data_sources.py -v --tb=short -m "slow"

      - name: Coverage report
        run: |
          python -m pytest tests/ -q \
            --cov=. --cov-report=term:skip-covered --cov-report=xml \
            -m "not slow"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
