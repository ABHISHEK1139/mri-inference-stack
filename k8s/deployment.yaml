apiVersion: apps/v1
kind: Deployment
metadata:
  name: mri-intelligence-app
  namespace: mri-intelligence
  labels:
    app: mri-intelligence
spec:
  # Two replicas so a node drain or rolling update does not take the service
  # offline. Pair this with the PodDisruptionBudget in pdb.yaml.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mri-intelligence
  template:
    metadata:
      labels:
        app: mri-intelligence
      annotations:
        # Roll the deployment when the pinned image tag changes.
        checksum/config: "replace-with-configmap-hash-on-release"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        # Container-level defaults. Enforced by the runtime, not just requested.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mri-app
          # Immutable, versioned tag. `:latest` makes rollbacks impossible and
          # lets a node silently run different code after a re-pull.
          image: ghcr.io/ABHISHEK1139/mri-inference-stack:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          envFrom:
            - configMapRef:
                name: mri-intelligence-config
          env:
            - name: STREAMLIT_SERVER_ADDRESS
              value: 0.0.0.0
            - name: STREAMLIT_BROWSER_GATHER_USAGE_STATS
              value: "false"
            # Streamlit writes to /tmp; the root filesystem is read-only.
            - name: STREAMLIT_CONFIG_DIR
              value: /tmp/streamlit
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            # Generous: the first request loads ~250 MB of model weights.
            failureThreshold: 40
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              # nvidia.com/gpu: 1  # Uncomment for GPU-accelerated inference
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: outputs-volume
              mountPath: /app/outputs
            # Optional: serve weights from a PVC instead of the image, so a new
            # model can be rolled in without rebuilding.
            # - name: weights-volume
            #   mountPath: /app/weights
            #   readOnly: true
      volumes:
        # Writable scratch. Required because the root filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: outputs-volume
          emptyDir:
            sizeLimit: 1Gi
        # Optional: PersistentVolumeClaim for external weights
        # - name: weights-volume
        #   persistentVolumeClaim:
        #     claimName: mri-weights-pvc
