# reproduces a known-good stack instead of resolving floating ranges.
#
# Regenerate deliberately, not on every build:
#     pip install pip-tools
#     pip-compile --output-file=requirements.lock requirements.txt
#
# Keep in sync with requirements.txt and re-run python -m pytest before merging.

